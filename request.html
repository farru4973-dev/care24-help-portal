
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Support Request | Care24.help</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f3f6fb;font-family:Arial,sans-serif;color:#17243a}
    header{background:#102b50;padding:20px}
    header a{color:#54d6b0;text-decoration:none;font-weight:bold}
    main{max-width:600px;margin:25px auto;padding:0 15px}
    .card{background:white;padding:24px 20px;border-radius:15px;box-shadow:0 5px 22px #17243a12}
    h1{font-size:25px;margin-top:0}
    .intro{color:#68778d;line-height:1.5}
    label{display:block;font-weight:bold;margin:17px 0 7px}
    input,textarea{width:100%;padding:13px;border:1px solid #d7dfeb;border-radius:8px;font-size:15px;background:white}
    textarea{min-height:160px;resize:vertical}
    button{width:100%;margin-top:22px;padding:15px;background:#1767d2;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold}
    button:disabled{opacity:.6}
    .notice{background:#fff7e6;padding:12px;border-radius:8px;color:#75551b;font-size:13px;line-height:1.5;margin-top:18px}
    #message{margin-top:15px;line-height:1.5}
    footer{text-align:center;color:#748197;font-size:12px;padding:25px}
  </style>
</head>
<body>

<header>
  <a href="../index.html">← Care24.help</a>
</header>

<main>
  <div class="card">
    <h1>Submit Support Request</h1>
    <p class="intro">Fill in your details and describe your issue.</p>

    <form id="supportForm">

      <label for="game">Selected Platform</label>
      <input id="game" name="game" readonly required>

      <label for="name">Full Name *</label>
      <input id="name" name="name" type="text" maxlength="80" required placeholder="Enter your name">

      <label for="phone">Phone Number *</label>
      <input id="phone" name="phone" type="tel" maxlength="20" required placeholder="Enter your phone number">

      <label for="email">Email Address *</label>
      <input id="email" name="email" type="email" maxlength="120" required placeholder="Enter your email">

      <label for="userId">User ID</label>
      <input id="userId" name="userId" type="text" maxlength="100" placeholder="Enter your User ID">

      <label for="amount">Amount (if relevant)</label>
      <input id="amount" name="amount" type="number" min="0" step="0.01" placeholder="Enter amount">

      <label for="details">Describe Your Issue *</label>
      <textarea id="details" name="details" maxlength="2000" required placeholder="Explain your problem in detail..."></textarea>

      <div class="notice">
        Never share your password, OTP, PIN, or full bank/card details.
      </div>

      <button type="submit">Submit Request</button>
      <p id="message" role="status"></p>

    </form>
  </div>
</main>

<footer>
  Care24.help · Independent Support Request Portal
</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("game").value = params.get("game") || "";

  document.getElementById("supportForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("message").textContent =
      "Secure submission is not connected yet. Please wait for the next setup step.";
  });
</script>

</body>
</html>
