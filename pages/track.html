
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Ticket | Care24</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#f3f6fb;
 font-family:Arial,sans-serif;color:#172033;
}
.card{
 max-width:440px;margin:45px auto;
 background:#fff;padding:25px;
 border-radius:17px;
 box-shadow:0 5px 25px #0001;
}
h2{text-align:center;margin-top:0}
.sub{text-align:center;color:#64748b;font-size:14px}
input,button{
 width:100%;padding:14px;
 margin-top:14px;border-radius:9px;
 font-size:16px;
}
input{border:1px solid #ccd3df}
button{
 border:0;background:#1746a2;
 color:white;font-weight:bold;cursor:pointer;
}
#result{display:none;margin-top:24px}
.status{
 padding:15px;border-radius:10px;
 text-align:center;font-weight:bold;
 font-size:18px;
}
.pending{background:#fff3d6;color:#956000}
.progress{background:#e3efff;color:#1755a5}
.resolved{background:#e1f7e9;color:#16713b}
.step{
 padding:13px;margin:9px 0;
 border:1px solid #e3e7ef;
 border-radius:9px;color:#8992a2;
}
.active{border-color:#1746a2;color:#1746a2;font-weight:bold}
.note{
 margin-top:20px;padding:11px;
 background:#f1f5f9;border-radius:8px;
 color:#64748b;font-size:12px;text-align:center;
}
</style>
</head>
<body>

<div class="card">
<h2>Track Your Ticket</h2>
<p class="sub">Check your support request status</p>

<input id="ticket" placeholder="Enter Ticket ID (CARE-XXXXXXXX)">
<button onclick="trackTicket()">Track Ticket</button>

<div id="result">
 <p id="ticketNumber" style="text-align:center;font-weight:bold"></p>
 <div id="status" class="status"></div>

 <div style="margin-top:20px">
  <div id="step1" class="step">● Pending</div>
  <div id="step2" class="step">● In Progress</div>
  <div id="step3" class="step">● Resolved</div>
 </div>

 <p id="timer" style="text-align:center;font-size:13px;color:#64748b"></p>
 <div class="note">Estimated status timeline. Actual resolution may vary.</div>
</div>
</div>

<script>
let interval;

function trackTicket(){
 const id=document.getElementById("ticket").value.trim().toUpperCase();

 if(!/^CARE-[A-Z0-9]+$/.test(id)){
  alert("Please enter a valid Ticket ID.");
  return;
 }

 document.getElementById("ticketNumber").textContent="Ticket ID: "+id;
 document.getElementById("result").style.display="block";

 const key="care24_status_"+id;
 let started=localStorage.getItem(key);

 if(!started){
  started=Date.now();
  localStorage.setItem(key,started);
 }

 clearInterval(interval);
 updateStatus(Number(started));
 interval=setInterval(()=>updateStatus(Number(started)),1000);
}

function updateStatus(started){
 const elapsed=Math.floor((Date.now()-started)/1000);
 const status=document.getElementById("status");

 ["step1","step2","step3"].forEach(id=>
  document.getElementById(id).classList.remove("active")
 );

 let remaining=0;

 if(elapsed<300){
  status.textContent="PENDING";
  status.className="status pending";
  document.getElementById("step1").classList.add("active");
  remaining=300-elapsed;
 }else if(elapsed<600){
  status.textContent="IN PROGRESS";
  status.className="status progress";
  document.getElementById("step2").classList.add("active");
  remaining=600-elapsed;
 }else{
  status.textContent="RESOLVED";
  status.className="status resolved";
  document.getElementById("step3").classList.add("active");
 }

 document.getElementById("timer").textContent=
 remaining>0
 ? "Next estimated update in "+Math.floor(remaining/60)+"m "+(remaining%60)+"s"
 : "Estimated timeline completed.";
}
</script>

</body>
</html>
